name: blocking-ci

# codex-custom is a personal/team fork that carries a small TUI status-line
# patch on top of upstream OpenAI Codex. The upstream blocking CI expects
# OpenAI-owned self-hosted runner groups and heavyweight Bazel infrastructure
# that are not available in this fork, so PRs in this repository use a focused
# validation surface instead.
on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: codex-custom-blocking-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  required:
    name: CI required
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Validate codex-custom surface
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: |
          set -euo pipefail
          cargo fmt -- --config imports_granularity=Item --check
          cargo test -p codex-tui
          cargo test -p codex-cli

      - name: Check release installer syntax
        run: bash -n scripts/install-codex-custom.sh
